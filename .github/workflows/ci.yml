name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_DB: guestbook_test
          POSTGRES_HOST_AUTH_METHOD: trust # Disposable runner database, no production credentials.
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guestbook_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/guestbook_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/guestbook_test?sslmode=disable
      STATIC_DIR: ${{ github.workspace }}/dev/dist
      API_BINARY: ${{ github.workspace }}/.local/obedman-api
      RUN_DATABASE_E2E: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: dev/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Frontend install, audit and build
        working-directory: dev
        run: |
          npm ci
          npm audit --audit-level=low
          npm run build
          npx --no-install playwright install --with-deps chromium
      - name: Go format, vet, test and build
        working-directory: api
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go test -race -count=1 ./...
          mkdir -p ../.local
          go build -trimpath -o "$API_BINARY" .
      - name: Go vulnerability check
        working-directory: api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Secret checks (redacted)
        run: |
          python3 scripts/scan-secrets.py
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          python3 scripts/gitleaks-check.py
      - name: PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Synthetic restore drill
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
        run: python3 scripts/restore-drill.py
      - name: Real browser/API/database flow and frontend regressions
        run: |
          "$API_BINARY" migrate
          "$API_BINARY" > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3030/api/ready > /dev/null; then break; fi
            sleep 0.2
          done
          cd dev
          npm test -- --workers=2
